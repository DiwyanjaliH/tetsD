<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #00ff88;
            padding: 20px;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 100, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff88;
        }

        .input-section {
            background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: #0a0a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            width: 120px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        button {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6f 100%);
            border: none;
            color: #000000;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            transition: all 0.3s ease;
            align-self: flex-end;
        }

        button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            margin-left: 10px;
        }

        .clear-btn:hover {
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.6);
        }

        .table-section {
            overflow-x: auto;
            background: linear-gradient(135deg, #1a1a3e 0%, #16213e 100%);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: linear-gradient(135deg, #0a4d4d 0%, #003333 100%);
            color: #00ff88;
            padding: 12px;
            text-align: center;
            border: 1px solid #00ff88;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #00ff88;
            color: #00ff88;
            font-size: 13px;
        }

        tr:nth-child(even) {
            background: rgba(0, 255, 136, 0.05);
        }

        tr:hover {
            background: rgba(0, 255, 136, 0.15);
        }

        .delete-btn {
            background: #ff4444;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        .nav-button {
            margin-top: 20px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6f 100%);
            border: none;
            color: #000000;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }

        .info-text {
            font-size: 12px;
            color: #00cc88;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Data Table Calculator</div>

        <div class="input-section">
            <div class="input-group">
                <div class="input-field">
                    <label for="xInput">X Value</label>
                    <input type="number" id="xInput" placeholder="Enter x" step="any">
                </div>
                <div class="input-field">
                    <label for="yInput">Y Value</label>
                    <input type="number" id="yInput" placeholder="Enter y" step="any">
                </div>
                <button onclick="addRow()">Add Row</button>
                <button class="clear-btn" onclick="clearAllData()">Clear All</button>
            </div>
            <div class="info-text">Enter X and Y values and click "Add Row" to calculate all derived values</div>
        </div>

        <div class="table-section">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Index</th>
                        <th>X<br>(×10⁻¹)</th>
                        <th>Y<br>(×10⁻⁸)</th>
                        <th>01^A<br>(×10⁸)</th>
                        <th>Y∆1^A<br>(×10⁸)</th>
                        <th>X'/σ1^A<br>(×10⁵)</th>
                        <th>X'Y/σ1^A<br>(×10⁷)</th>
                        <th>XY(Y)/σ1^2<br>(×10⁶)</th>
                        <th>XY'/σ1^2<br>(×10³)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <button class="nav-button" onclick="goToCalculator()">← Back to Calculator</button>
    </div>

    <script>
        let dataRows = [];
        let rowIndex = 0;

        function addRow() {
            const xInput = document.getElementById('xInput');
            const yInput = document.getElementById('yInput');

            const x = parseFloat(xInput.value);
            const y = parseFloat(yInput.value);

            if (isNaN(x) || isNaN(y)) {
                alert('Please enter valid X and Y values');
                return;
            }

            rowIndex++;
            
            // Calculate derived values
            const col1 = x / 1e1;  // X × 10⁻¹
            const col2 = y / 1e8;  // Y × 10⁻⁸
            const col3 = 1 * 1e8;  // 01^A × 10⁸ (constant = 1)
            const col4 = y * 1e8;  // Y∆1^A × 10⁸
            const col5 = (x / 1) * 1e5;  // X'/σ1^A × 10⁵
            const col6 = (x * y / 1) * 1e7;  // X'Y/σ1^A × 10⁷
            const col7 = (x * y * y / 1) * 1e6;  // XY(Y)/σ1^2 × 10⁶
            const col8 = (x * y / 1) * 1e3;  // XY'/σ1^2 × 10³

            const row = {
                index: rowIndex,
                x: x,
                y: y,
                col1: col1.toFixed(6),
                col2: col2.toExponential(2),
                col3: col3.toExponential(2),
                col4: col4.toExponential(2),
                col5: col5.toExponential(2),
                col6: col6.toExponential(2),
                col7: col7.toExponential(2),
                col8: col8.toExponential(2)
            };

            dataRows.push(row);
            renderTable();

            // Clear inputs
            xInput.value = '';
            yInput.value = '';
            xInput.focus();
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            dataRows.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.index}</td>
                    <td>${row.col1}</td>
                    <td>${row.col2}</td>
                    <td>${row.col3}</td>
                    <td>${row.col4}</td>
                    <td>${row.col5}</td>
                    <td>${row.col6}</td>
                    <td>${row.col7}</td>
                    <td>${row.col8}</td>
                    <td><button class="delete-btn" onclick="deleteRow(${idx})">Delete</button></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function deleteRow(index) {
            dataRows.splice(index, 1);
            renderTable();
        }

        function clearAllData() {
            if (confirm('Are you sure you want to clear all data?')) {
                dataRows = [];
                rowIndex = 0;
                document.getElementById('xInput').value = '';
                document.getElementById('yInput').value = '';
                renderTable();
            }
        }

        function goToCalculator() {
            window.location.href = 'calculator.html';
        }

        // Allow Enter key to add row
        document.getElementById('yInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addRow();
            }
        });

        document.getElementById('xInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('yInput').focus();
            }
        });

        // Ctrl+C to clear all
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'c') {
                event.preventDefault();
                clearAllData();
            }
        });
    </script>
</body>
</html>
